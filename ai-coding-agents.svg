<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Kiro — AI Coding Agents</title>
  <desc id="desc">Dark tech showcase for Claude, Cursor, OpenAI Codex, and Google Antigravity using neon cyan and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".52" stop-color="#071329"/><stop offset="1" stop-color="#100827"/></linearGradient>
    <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#6366F1"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <linearGradient id="claude" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDBA9A"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="codex" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="anti" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#64748B" stroke-opacity=".12"/><circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity=".25"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="620" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="url(#cyanViolet)" stroke-width="1.5" stroke-opacity=".65">
    <path d="M0 115H70L104 81H185"/><path d="M1200 101H1122L1087 136H1040"/>
    <path d="M0 470H55L90 505H172"/><path d="M1200 450H1132L1098 484H1044"/>
    <path d="M390 0V27H424"/><path d="M810 620V590H850"/>
  </g>
  <g fill="#22D3EE"><circle cx="185" cy="81" r="3"/><circle cx="1040" cy="136" r="3"/><circle cx="172" cy="505" r="3"/><circle cx="1044" cy="484" r="3"/></g>
  <text x="600" y="66" text-anchor="middle" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="7">KIRO · DEVELOPER TOOLKIT</text>
  <text x="600" y="118" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="750" letter-spacing="2">AI CODING AGENTS</text>
  <rect x="496" y="137" width="208" height="4" rx="2" fill="url(#cyanViolet)" filter="url(#glow)"/>
  <text x="600" y="168" text-anchor="middle" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2">BETTER TOOLS · FASTER DEVELOPMENT · BIGGER IDEAS</text>
  <g filter="url(#shadow)">
    <rect x="58" y="210" width="254" height="275" rx="20" fill="#080D20" fill-opacity=".94" stroke="#C084FC" stroke-width="2"/>
    <rect x="64" y="216" width="242" height="263" rx="16" fill="none" stroke="#7C3AED" stroke-opacity=".32"/>
    <rect x="337" y="210" width="254" height="275" rx="20" fill="#061322" fill-opacity=".96" stroke="#22D3EE" stroke-width="2"/>
    <rect x="343" y="216" width="242" height="263" rx="16" fill="none" stroke="#0EA5E9" stroke-opacity=".33"/>
    <rect x="616" y="210" width="254" height="275" rx="20" fill="#0B0925" fill-opacity=".96" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="622" y="216" width="242" height="263" rx="16" fill="none" stroke="#A78BFA" stroke-opacity=".34"/>
    <rect x="895" y="210" width="247" height="275" rx="20" fill="#061322" fill-opacity=".96" stroke="#22D3EE" stroke-width="2"/>
    <rect x="901" y="216" width="235" height="263" rx="16" fill="none" stroke="#0EA5E9" stroke-opacity=".33"/>
  </g>
  <!-- Claude-inspired abstract burst -->
  <g transform="translate(185 295)" stroke="url(#claude)" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
    <path d="M0 -42V42M-42 0H42M-30 -30L30 30M-30 30L30 -30"/>
    <path d="M-14 -39L14 39M-39 -14L39 14M-39 14L39 -14M-14 39L14 -39" stroke-width="7"/>
  </g>
  <!-- Cursor-inspired layered cursor geometry -->
  <g transform="translate(464 297)" filter="url(#glow)">
    <path d="M-42 -47L46 -2L5 8L-6 47Z" fill="url(#cursor)" fill-opacity=".95" stroke="#BAE6FD" stroke-width="1.5"/>
    <path d="M-42 -47L5 8L-6 47Z" fill="#0F2741" fill-opacity=".7"/>
    <path d="M5 8L46 -2L-6 47Z" fill="#22D3EE" fill-opacity=".75"/>
  </g>
  <!-- Codex-inspired abstract hex mark -->
  <g transform="translate(743 296)" fill="none" filter="url(#glow)">
    <path d="M0 -48L42 -24V24L0 48L-42 24V-24Z" stroke="url(#codex)" stroke-width="12" stroke-linejoin="round"/>
    <path d="M0 -20L18 -10V10L0 20L-18 10V-10Z" fill="#8B5CF6" fill-opacity=".82" stroke="#C4B5FD" stroke-width="2"/>
  </g>
  <!-- Antigravity-inspired abstract A -->
  <g transform="translate(1018 298)" fill="none" stroke="url(#anti)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-45 38L-5 -42Q0 -52 7 -40L46 38"/>
    <path d="M-29 10L29 10" stroke="#818CF8" stroke-width="8"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="185" y="386" fill="#F8FAFC" font-size="25" font-weight="700">Claude</text>
    <text x="185" y="414" fill="#D8B4FE" font-size="12" letter-spacing="2">RESEARCH · ANALYSIS</text>
    <rect x="164" y="441" width="42" height="3" rx="1.5" fill="#E879F9"/>
    <text x="464" y="386" fill="#F8FAFC" font-size="25" font-weight="700">Cursor</text>
    <text x="464" y="414" fill="#67E8F9" font-size="12" letter-spacing="2">CODE · EDIT · BUILD</text>
    <rect x="443" y="441" width="42" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="743" y="386" fill="#F8FAFC" font-size="25" font-weight="700">Codex</text>
    <text x="743" y="414" fill="#C4B5FD" font-size="12" letter-spacing="2">AUTOMATE · EXECUTE</text>
    <rect x="722" y="441" width="42" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="1018" y="386" fill="#F8FAFC" font-size="25" font-weight="700">Antigravity</text>
    <text x="1018" y="414" fill="#67E8F9" font-size="11" letter-spacing="1.5">MULTI-AGENT WORKFLOW</text>
    <rect x="997" y="441" width="42" height="3" rx="1.5" fill="#22D3EE"/>
  </g>
  <g>
    <rect x="58" y="520" width="445" height="61" rx="9" fill="#030712" stroke="#334155" stroke-opacity=".85"/>
    <text x="79" y="544" fill="#22D3EE" font-family="Consolas,monospace" font-size="13">&gt; const workflow = "human + AI";</text>
    <text x="79" y="564" fill="#A78BFA" font-family="Consolas,monospace" font-size="13">&gt; review(); test(); ship();</text>
    <text x="1140" y="543" text-anchor="end" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">TURN IDEAS</text>
    <text x="1140" y="565" text-anchor="end" fill="#22D3EE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">INTO REAL PRODUCTS</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="618.5" rx="21.5" fill="none" stroke="#64748B" stroke-opacity=".5"/>
</svg>