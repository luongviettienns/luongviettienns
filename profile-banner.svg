<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kiro — Dark Tech Developer Banner</title>
  <desc id="desc">A dark navy developer banner with cyan and violet circuitry, terminal details, and subtle grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#07152B"/>
      <stop offset="100%" stop-color="#160B31"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="43%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.3" fill="#22D3EE" fill-opacity=".20"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="url(#line)" stroke-width="1.6" stroke-opacity=".72">
    <path d="M760 0V42H815V70H900"/>
    <path d="M870 0V28H940V54H1010V90H1200"/>
    <path d="M1200 124H1125V156H1080V182H1024"/>
    <path d="M1200 236H1100V210H1055V192H980"/>
    <path d="M920 320V286H965V258H1012"/>
    <path d="M720 320V282H782V254H835"/>
    <path d="M0 255H90V220H138V190H180"/>
    <path d="M0 92H80V120H115V144H160"/>
  </g>
  <g fill="#22D3EE" filter="url(#softGlow)">
    <circle cx="900" cy="70" r="3"/><circle cx="1010" cy="90" r="3"/>
    <circle cx="1024" cy="182" r="3"/><circle cx="980" cy="192" r="3"/>
    <circle cx="1012" cy="258" r="3"/><circle cx="835" cy="254" r="3"/>
    <circle cx="180" cy="190" r="3"/><circle cx="160" cy="144" r="3"/>
  </g>
  <g opacity=".55" transform="translate(830 84)">
    <rect x="0" y="0" width="250" height="148" rx="10" fill="#020617" fill-opacity=".66" stroke="#64748B" stroke-opacity=".6"/>
    <path d="M0 34H250" stroke="#64748B" stroke-opacity=".5"/>
    <circle cx="17" cy="17" r="4" fill="#FB7185"/><circle cx="31" cy="17" r="4" fill="#FBBF24"/><circle cx="45" cy="17" r="4" fill="#34D399"/>
    <g font-family="Consolas,monospace" font-size="12">
      <text x="17" y="58" fill="#22D3EE">const</text><text x="57" y="58" fill="#E2E8F0"> developer = {</text>
      <text x="27" y="79" fill="#A78BFA">build:</text><text x="75" y="79" fill="#86EFAC"> "with purpose",</text>
      <text x="27" y="100" fill="#A78BFA">learn:</text><text x="75" y="100" fill="#86EFAC"> "every day"</text>
      <text x="17" y="121" fill="#E2E8F0">};</text>
    </g>
  </g>
  <g>
    <text x="70" y="67" fill="#67E8F9" font-family="Consolas,monospace" font-size="14" letter-spacing="3">SOFTWARE ENGINEERING • VIETNAM</text>
    <text x="66" y="142" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-1.2">Kiro</text>
    <rect x="69" y="162" width="75" height="4" rx="2" fill="url(#line)"/>
    <text x="70" y="202" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500">Full-stack Web Developer · AI Enthusiast</text>
    <text x="70" y="238" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Build thoughtfully. Learn continuously. Ship better software.</text>
    <text x="70" y="278" fill="#22D3EE" font-family="Consolas,monospace" font-size="13">[ TypeScript ]  [ Node.js ]  [ React ]  [ PyTorch ]</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="21.5" fill="none" stroke="#64748B" stroke-opacity=".42" stroke-width="1.5"/>
</svg>